name: Android

on:
  push:
    paths: ["android/**", "lang/**", "places/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "lang/**", "places/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: back-then-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Runs the shrunk release build on an emulator, since R8 can strip code that only
  # breaks at run time.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make sample photos
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pillow piexif
          /tmp/venv/bin/python .github/screenshots/make_photos.py /tmp/photos
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PsignReleaseWithDebugKey --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/release-smoke.sh
