name: App Store review

# Gets the version in the Xcode project ready in App Store Connect (renaming or making the
# version record, picking the uploaded build, What's New, App Review contact and notes),
# then sends it for review. Run it from the Actions tab after the App Store workflow has
# uploaded the build. See app-store/README.md.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Send the version for review (off only sets the contact and notes)
        type: boolean
        default: true
      replace:
        description: If an older version is still waiting for review, pull it back and send this one instead
        type: boolean
        default: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send for review
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          REVIEW_NAME: Najeeb Jarrar
          REVIEW_EMAIL: njarrar@gmail.com
          SUBMIT: ${{ inputs.submit }}
          REPLACE: ${{ inputs.replace }}
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q "pyjwt[crypto]" requests
          /tmp/venv/bin/python .github/app-store/submit.py | tee -a "$GITHUB_STEP_SUMMARY"
