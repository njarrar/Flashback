name: Build apps

# Builds both apps and puts them on the "latest-build" GitHub release, replacing the last
# copies. Release files stay out of git, so the repo doesn't grow with every build.
# Run it from the Actions tab (Build apps, Run workflow) after app changes.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/build.yml"]

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -project BackThen.xcodeproj -scheme BackThen -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Zip the app
        run: |
          mkdir -p out
          ditto -c -k --keepParent "/tmp/dd/Build/Products/Release-iphonesimulator/Back Then.app" out/BackThen-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Load the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key secrets, so the APK uses a throwaway debug key and will not install over an earlier one."
          fi
      - name: Build APK
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleDebug
      - name: Copy APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/BackThen-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out }

  release:
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: /tmp/apps, merge-multiple: true }
      - name: Upload to the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l /tmp/apps
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build \
            --title "Latest build" --prerelease --target "$GITHUB_SHA" --notes "Ready-made apps for testing."
          gh release upload latest-build /tmp/apps/* --clobber
          gh release edit latest-build --notes "Ready-made apps for testing, built from $GITHUB_SHA. See the README for how to install each one."
