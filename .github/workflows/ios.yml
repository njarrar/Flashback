name: iOS

on:
  push:
    paths: ["ios/**", "lang/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "lang/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -project BackThen.xcodeproj -scheme BackThen \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcodebuild -project BackThen.xcodeproj -scheme BackThen \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO test
