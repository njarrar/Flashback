name: Play Store

# Makes everything the Google Play upload needs:
#   BackThen-Android.aab             release bundle (signed when the upload key secrets are set),
#                                    on the "latest-build" GitHub release, not in git
#   play-store/graphics/             app icon and a feature graphic per language
#   play-store/screenshots/<lang>/   phone screenshots in English, French, Spanish and Arabic
# Run it from the Actions tab (Play Store, Run workflow). See play-store/README.md.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/play.yml", ".github/play/**"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Load the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No UPLOAD_KEYSTORE_BASE64 secret, so the bundle will be unsigned. See play-store/README.md."
          fi
      - name: Build the release bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace
      - name: Check the signature
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/BackThen-Android.aab
          if jarsigner -verify out/BackThen-Android.aab | grep -q "jar verified"; then
            echo "Signed with the upload key." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Not signed. Add the upload key secrets and run again before uploading to Play." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: bundle, path: out }

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Make sample photos
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libraqm0 libfribidi0
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pillow piexif
          /tmp/venv/bin/python .github/screenshots/make_photos.py /tmp/photos
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LANGS: en fr es ar
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/screenshots/android.sh
      - name: Frame screenshots and make graphics
        run: |
          /tmp/venv/bin/python -c "from PIL import features; assert features.check('raqm'), 'Arabic text needs raqm'"
          /tmp/venv/bin/python .github/play/frame.py shots/android out/screenshots
          /tmp/venv/bin/python .github/play/graphics.py out/graphics
      - uses: actions/upload-artifact@v4
        with: { name: store, path: out }

  commit:
    needs: [bundle, screenshots]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.head_ref || github.ref_name }}" }
      - uses: actions/download-artifact@v4
        with: { path: /tmp/out }
      - name: Commit
        run: |
          mkdir -p play-store
          rm -rf play-store/screenshots play-store/graphics
          cp -r /tmp/out/store/screenshots /tmp/out/store/graphics play-store/
          ls -R play-store
          git config user.name "njarrar"
          git config user.email "njarrar@gmail.com"
          git add play-store
          git diff --cached --quiet || git commit -m "Update Play Store screenshots and graphics"
          # Other workflows commit to the same branch, so catch up before pushing.
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
      - name: Upload the bundle to the latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build \
            --title "Latest build" --prerelease --target "$GITHUB_SHA" --notes "Ready-made apps for testing."
          gh release upload latest-build /tmp/out/bundle/BackThen-Android.aab --clobber
