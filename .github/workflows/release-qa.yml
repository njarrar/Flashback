name: Release QA

# Gates 1 to 3 of docs/QA.md, on emulators and simulators. The Play Store workflow calls this
# with platform "android" and the App Store workflow with "ios"; neither uploads unless every
# job here passes. It also runs on pull requests that touch
# the app, and from the Actions tab (Release QA, Run workflow).
on:
  workflow_call:
    inputs:
      platform:
        description: android, ios, or all
        type: string
        default: all
  workflow_dispatch:
  pull_request:
    paths: ["ios/**", "android/**", "lang/**", "places/**", ".github/qa/**", ".github/text-check/scenes.txt", ".github/workflows/release-qa.yml"]
  push:
    branches-ignore: [main]
    paths: ["ios/**", "android/**", "lang/**", "places/**", ".github/qa/**", ".github/text-check/scenes.txt", ".github/workflows/release-qa.yml"]

# A newer push to the same branch cancels a sweep still running for an older one. Store
# workflows (workflow_dispatch) are never cancelled.
concurrency:
  group: release-qa-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch main, to compare the city list
        run: git fetch -q --depth=1 origin main || true
      - name: Quick release checks
        shell: bash  # with pipefail, so a failed check fails the step despite tee
        run: python3 .github/qa/release_check.py | tee -a "$GITHUB_STEP_SUMMARY"

  # Unit tests, the on-phone tests in every language, and the true store build (signed with
  # the debug key so it installs) opened twice with the raw key check.
  android-device:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Make sample photos
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pillow piexif
          /tmp/venv/bin/python .github/screenshots/make_photos.py /tmp/photos
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PsignReleaseWithDebugKey --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: On-phone tests and store build check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/qa/android-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device
          path: |
            shots/qa
            android/app/build/reports/androidTests

  # Every screen in every language on the oldest Android the app supports (8.0, a smaller
  # phone) and the newest (16, Pixel 7 size), from the QA build.
  android-sweep:
    if: inputs.platform != 'ios'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, profile: "Nexus 5", target: google_apis }
          - { api: 36, profile: pixel_7, target: google_apis }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Make sample photos
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pillow piexif
          /tmp/venv/bin/python .github/screenshots/make_photos.py /tmp/photos
      - name: Build the QA build
        working-directory: android
        run: ./gradlew assembleQa --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screen sweep
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/qa/android-sweep.sh
      - name: Summary
        if: always()
        run: |
          echo "### Android ${{ matrix.api }} screen sweep" >> "$GITHUB_STEP_SUMMARY"
          f=$(ls shots/sweep/*/problems.txt 2>/dev/null | head -1)
          if [ -s "$f" ]; then sed 's/^/- /' "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "No problems found." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sweep-api${{ matrix.api }}
          path: shots/sweep

  # Every screen in every language on the iPhone simulator: the oldest iOS the Mac machines
  # carry (18, on a small phone) and the newest (26, on a large one). iOS 17 is supported but
  # can't be tested here. The QA build is the optimized Release build with the -scene options on.
  ios-sweep:
    if: inputs.platform != 'android'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: "iOS 18", device: "iPhone SE (3rd generation)", name: ios18-se }
          - { runtime: "iOS 26", device: "iPhone 17 Pro Max", name: ios26-promax }
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::No Xcode 26 on this runner."; exit 1; }
          sudo xcode-select -s "$XCODE"
      - name: Make sample photos
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pillow piexif
          /tmp/venv/bin/python .github/screenshots/make_photos.py /tmp/photos
      - name: Unit tests
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "^ +iPhone [0-9]+ Pro \(" | tail -1 | grep -oE "[0-9A-F-]{36}")
          xcodebuild -project BackThen.xcodeproj -scheme BackThen -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO test -quiet
      - name: Build the QA build
        working-directory: ios
        run: |
          xcodebuild -project BackThen.xcodeproj -scheme BackThen -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/dd \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Screen sweep
        run: bash .github/qa/ios-sweep.sh "${{ matrix.device }}" "${{ matrix.runtime }}" ${{ matrix.name }}
      - name: Summary
        if: always()
        run: |
          echo "### iPhone screen sweep, ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          f=shots/sweep/${{ matrix.name }}/problems.txt
          if [ -s "$f" ]; then sed 's/^/- /' "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "No problems found." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sweep-${{ matrix.name }}
          path: shots/sweep
