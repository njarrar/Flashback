name: Screenshots

# Takes README screenshots from the real apps on a simulator and an emulator,
# then commits them to docs/screenshots.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/screenshots.yml", ".github/screenshots/**"]

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Make sample photos
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pillow piexif
          /tmp/venv/bin/python .github/screenshots/make_photos.py /tmp/photos
      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project BackThen.xcodeproj -scheme BackThen -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Take screenshots
        run: |
          set -x
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl addmedia "$DEVICE" /tmp/photos/*.jpg
          APP="/tmp/dd/Build/Products/Debug-iphonesimulator/Back Then.app"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl privacy "$DEVICE" grant photos com.njarrar.backthen
          mkdir -p shots/ios
          xcrun simctl launch "$DEVICE" com.njarrar.backthen
          sleep 8
          xcrun simctl io "$DEVICE" screenshot shots/ios/1-welcome.png
          for scene in today calendar viewer favorites album; do
            xcrun simctl terminate "$DEVICE" com.njarrar.backthen || true
            xcrun simctl launch "$DEVICE" com.njarrar.backthen -scene $scene
            sleep 10
            xcrun simctl io "$DEVICE" screenshot "shots/ios/$scene.png"
          done
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: shots/ios }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Make sample photos
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pillow piexif
          /tmp/venv/bin/python .github/screenshots/make_photos.py /tmp/photos
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/screenshots/android.sh
      - uses: actions/upload-artifact@v4
        with: { name: android, path: shots/android }

  commit:
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.head_ref || github.ref_name }}" }
      - uses: actions/download-artifact@v4
        with: { path: docs/screenshots }
      - name: Commit
        run: |
          ls -R docs/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Update README screenshots"
          git push
